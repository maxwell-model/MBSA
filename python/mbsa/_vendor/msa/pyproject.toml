[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmha_sm100"
version = "0.1.1"
description = "Retained MiniMax MSA BF16 CuTe-DSL forward and CSR runtime for SM100"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MiniMax" }]
dependencies = [
    "torch",
    "apache-tvm-ffi",
    "ninja",
    "cuda-python",
    "nvidia-cutlass-dsl>=4.4.1",
    "quack-kernels>=0.2.10",
]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["fmha_sm100"]

# Sparse runtime imports are relative to their owning package.
[tool.setuptools.package-data]
fmha_sm100 = ["cute/**/*.py", "cute/**/*.cu", "cute/**/*.md", "cute/**/*.txt"]
