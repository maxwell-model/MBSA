<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Flash BSA independent Triton execution flow</title>
  <desc id="desc">Exact hierarchical routing feeds a KV-major dynamic attention path, while position-derived prefix and sliding-window blocks feed a fixed attention path. Their online-softmax states are merged into the final output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#F47B60"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #38251F; }
      .section { font: 700 20px Inter, Arial, sans-serif; fill: #38251F; }
      .label { font: 600 20px Inter, Arial, sans-serif; fill: #38251F; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #634A40; }
      .tiny { font: 500 14px Inter, Arial, sans-serif; fill: #634A40; }
      .node { fill: #FFF0E7; stroke: #D78B70; stroke-width: 2; rx: 9; }
      .stage { fill: #F8B89D; stroke: #D86F55; stroke-width: 2.2; rx: 9; }
      .focus { fill: #F47B60; stroke: #C95C45; stroke-width: 2.2; rx: 9; }
      .state { fill: #FFE2D3; stroke: #D78B70; stroke-width: 2; rx: 9; }
      .flow { fill: none; stroke: #F47B60; stroke-width: 3; marker-end: url(#arrow); }
      .frame { fill: #FFF9F5; stroke: #D7A28D; stroke-width: 2; stroke-dasharray: 9 8; rx: 15; }
      .divider { stroke: #E8B8A6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#FFFFFF"/>
  <text x="45" y="55" class="title">Flash BSA — Independent Triton Baseline</text>
  <line x1="45" y1="75" x2="1755" y2="75" class="divider"/>

  <text x="55" y="115" class="section">Exact dynamic routing</text>
  <rect x="55" y="145" width="190" height="82" class="node"/>
  <text x="150" y="180" text-anchor="middle" class="label">Index Q / K</text>
  <text x="150" y="207" text-anchor="middle" class="small">4 Q heads · shared K head</text>

  <rect x="325" y="135" width="300" height="102" class="stage"/>
  <text x="475" y="174" text-anchor="middle" class="label">Block Index Score</text>
  <text x="475" y="202" text-anchor="middle" class="small">64-query tiles · 16-block partitions</text>
  <text x="475" y="224" text-anchor="middle" class="tiny">Fixed-support masking in score stage</text>

  <rect x="705" y="145" width="250" height="82" class="stage"/>
  <text x="830" y="180" text-anchor="middle" class="label">Exact Global Top-16</text>
  <text x="830" y="207" text-anchor="middle" class="small">Deterministic candidate merge</text>

  <rect x="1035" y="135" width="310" height="102" class="stage"/>
  <text x="1190" y="174" text-anchor="middle" class="label">KV-Major Route Ordering</text>
  <text x="1190" y="202" text-anchor="middle" class="small">PyTorch argsort by KV head / block</text>
  <text x="1190" y="224" text-anchor="middle" class="tiny">16-query groups + exact boundary fallback</text>

  <path d="M245 186 H325" class="flow"/>
  <path d="M625 186 H705" class="flow"/>
  <path d="M955 186 H1035" class="flow"/>

  <rect x="485" y="285" width="1280" height="385" class="frame"/>
  <rect x="675" y="267" width="360" height="38" fill="#FFFFFF"/>
  <text x="855" y="296" text-anchor="middle" class="section">Dual-Path Triton Attention</text>

  <rect x="535" y="350" width="205" height="82" class="node"/>
  <text x="637" y="385" text-anchor="middle" class="label">Q / K / V</text>
  <text x="637" y="412" text-anchor="middle" class="small">BF16 · GQA 32:4</text>

  <rect x="835" y="330" width="330" height="112" class="focus"/>
  <text x="1000" y="370" text-anchor="middle" class="label">Dynamic BSA</text>
  <text x="1000" y="400" text-anchor="middle" class="small">KV-major grouped Triton CTAs</text>
  <text x="1000" y="424" text-anchor="middle" class="tiny">16 queries share each selected K/V block</text>

  <rect x="835" y="520" width="330" height="102" class="stage"/>
  <text x="1000" y="558" text-anchor="middle" class="label">Fixed BSA</text>
  <text x="1000" y="588" text-anchor="middle" class="small">Implicit Prefix-8 + Sliding-Window-8</text>
  <text x="1000" y="611" text-anchor="middle" class="tiny">128-query tiled online softmax</text>

  <rect x="1245" y="330" width="215" height="112" class="state"/>
  <text x="1352" y="370" text-anchor="middle" class="label">Dynamic States</text>
  <text x="1352" y="399" text-anchor="middle" class="small">BF16 partial O</text>
  <text x="1352" y="424" text-anchor="middle" class="small">FP32 LSE</text>

  <rect x="1245" y="520" width="215" height="102" class="state"/>
  <text x="1352" y="559" text-anchor="middle" class="label">Fixed State</text>
  <text x="1352" y="588" text-anchor="middle" class="small">O<tspan baseline-shift="sub" font-size="13">f</tspan> · LSE<tspan baseline-shift="sub" font-size="13">f</tspan></text>

  <rect x="1520" y="415" width="200" height="112" class="stage"/>
  <text x="1620" y="455" text-anchor="middle" class="label">Stable State Merge</text>
  <text x="1620" y="484" text-anchor="middle" class="small">Online-softmax reduction</text>
  <text x="1620" y="508" text-anchor="middle" class="tiny">Natural-log LSE domain</text>

  <rect x="1520" y="575" width="200" height="64" class="node"/>
  <text x="1620" y="615" text-anchor="middle" class="label">Output (O, LSE)</text>

  <path d="M1190 237 V278 H1000 V330" class="flow"/>
  <path d="M740 385 H835" class="flow"/>
  <path d="M637 432 V571 H835" class="flow"/>
  <path d="M1165 386 H1245" class="flow"/>
  <path d="M1165 571 H1245" class="flow"/>
  <path d="M1460 386 H1485 V447 H1520" class="flow"/>
  <path d="M1460 571 H1485 V495 H1520" class="flow"/>
  <path d="M1620 527 V575" class="flow"/>

  <text x="510" y="695" class="tiny">Independent streams may overlap fixed attention with route generation; final merge waits for both states.</text>
  <text x="510" y="720" class="tiny">Current baseline: Triton compute kernels + PyTorch KV-major ordering.</text>
</svg>
