[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mbsa"
version = "0.1.0"
description = "Maxwell Block Sparse Attention: Blackwell FA4/Fireworks prefill with FP8/FP16/MXFP6 Index"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
# Install the official FA4 b20 wheel separately with --no-deps; see README.
# Its upstream CUTLASS dev-version pin conflicts with this validated stable stack.
fireworks = ["torch>=2.9", "triton>=3.5.1; sys_platform == 'linux'", "nvidia-cutlass-dsl[cu13]==4.6.0", "cuda-python>=13,<14", "apache-tvm-ffi>=0.1.12,<0.2", "quack-kernels==0.6.3", "ninja"]
dev = ["build>=1.2", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "python"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mbsa = ["third_party/**/LICENSE", "third_party/**/NOTICE", "third_party/**/AUTHORS", "third_party/**/*.md", "third_party/**/*.json", "mxfp6/csrc/*.cu", "mxfp6/csrc/*.cuh"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Preserve attributed kernel bodies; unused DSL expressions may be intentional.
"python/mbsa/cute/src/common/**" = ["F401", "F841"]
"python/mbsa/cute/src/sm100/**" = ["F841"]
"python/mbsa/cute/kvouter/build_kvouter_index.py" = ["F841"]
"python/mbsa/cute/kvouter/sparse_fwd_kvouter.py" = ["F841"]
"python/mbsa/cute/kvouter/sparse_fwd_kvouter_combine.py" = ["F401"]
"python/mbsa/cute/kvouter/sparse_fwd_kvouter_load_balance_schedule.py" = ["F401"]
